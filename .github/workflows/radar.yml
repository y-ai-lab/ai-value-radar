name: EdgeX breakout scan (standalone scheduler)

# The former AI VALUE RADAR workflow is retained as an established GitHub
# schedule slot, but it now runs only the independent EdgeX alert scanner.
on:
  schedule:
    # Run every five minutes off the top of the hour to reduce scheduler load.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: edgex-breakout-scan-standalone
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DRY_RUN: "false"
      STATE_BACKEND: json
      STATE_FILE: data/edgex_alert_state.json
      EDGE_X_INTERVALS: MINUTE_5
      EDGE_X_INCLUDE_HIDDEN: "true"
      TIMEZONE: Asia/Tokyo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: edgex-breakout-alert
        run: python -m pip install -r requirements.txt

      - name: Run EdgeX tests
        working-directory: edgex-breakout-alert
        run: python -m unittest discover -s tests -v

      - name: Scan all tradable EdgeX contracts
        working-directory: edgex-breakout-alert
        run: python app.py --once --once-timeout 90 --log-level INFO

      - name: Commit notification deduplication state
        if: ${{ success() }}
        run: |
          if [ -z "$(git status --porcelain -- edgex-breakout-alert/data/edgex_alert_state.json)" ]; then
            echo "No state change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edgex-breakout-alert/data/edgex_alert_state.json
          git commit -m "chore: update EdgeX alert state"
          git pull --rebase origin main
          git push
