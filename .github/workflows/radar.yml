name: EdgeX breakout scan (standalone scheduler)

# The former AI VALUE RADAR workflow is retained as an established GitHub
# schedule slot, but it now runs only the independent EdgeX alert scanner.
on:
  schedule:
    # A proven six-hour schedule starts a long-running scanner session.
    # The scanner itself checks the latest confirmed 15-minute candle every four minutes.
    - cron: "0 5,11,17,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: edgex-breakout-scan-standalone
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DRY_RUN: "false"
      STATE_BACKEND: json
      STATE_FILE: edgex-breakout-alert/data/edgex_alert_state.json
      EDGE_X_INTERVALS: MINUTE_15
      EDGE_X_BREAKOUT_LOOKBACK: "20"
      EDGE_X_VOLUME_LOOKBACK: "20"
      EDGE_X_VOLUME_MULTIPLIER: "1.8"
      EDGE_X_MIN_BREAKOUT_PCT: "0.2"
      EDGE_X_ALERT_COOLDOWN_MINUTES: "60"
      EDGE_X_HISTORY_SIZE: "85"
      EDGE_X_TREND_FILTER: "true"
      EDGE_X_TREND_FAST_PERIOD: "20"
      EDGE_X_TREND_SLOW_PERIOD: "50"
      EDGE_X_REQUIRE_DIRECTIONAL_BODY: "true"
      EDGE_X_CLOSE_LOCATION_THRESHOLD: "0.65"
      EDGE_X_RISK_BUDGET_USD: "0.15"
      EDGE_X_MAX_POSITION_NOTIONAL_USD: "10"
      EDGE_X_STOP_BUFFER_PCT: "0.3"
      EDGE_X_TAKE_PROFIT_1_R: "1"
      EDGE_X_TAKE_PROFIT_2_R: "2"
      EDGE_X_INCLUDE_HIDDEN: "true"
      TIMEZONE: Asia/Tokyo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: edgex-breakout-alert
        run: python -m pip install -r requirements.txt

      - name: Run EdgeX tests
        working-directory: edgex-breakout-alert
        run: python -m unittest discover -s tests -v

      - name: Scan all tradable EdgeX contracts every four minutes
        shell: bash
        run: |
          set -euo pipefail
          end_epoch=$(( $(date +%s) + 21000 ))

          while [ "$(date +%s)" -lt "$end_epoch" ]; do
            echo "Starting EdgeX scan at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            python edgex-breakout-alert/app.py --once --once-timeout 90 --log-level INFO

            if [ -n "$(git status --porcelain -- edgex-breakout-alert/data/edgex_alert_state.json)" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add edgex-breakout-alert/data/edgex_alert_state.json
              git commit -m "chore: update EdgeX alert state"
              git pull --rebase origin main
              git push
            fi

            remaining=$(( end_epoch - $(date +%s) ))
            if [ "$remaining" -le 0 ]; then
              break
            fi
            sleep_seconds=240
            if [ "$remaining" -lt "$sleep_seconds" ]; then
              sleep_seconds="$remaining"
            fi
            echo "Next EdgeX scan in ${sleep_seconds}s"
            sleep "$sleep_seconds"
          done

      - name: Session summary
        if: ${{ always() }}
        run: echo "EdgeX scanner session ended at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
