<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>発信用パック｜AI VALUE RADAR</title>
  <link rel="stylesheet" href="assets/radar.css">
  <style>
    .pack-shell { width: min(820px, calc(100% - 24px)); margin: 0 auto; }
    .pack-top { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:18px 0; }
    .back-link { color:var(--blue); font-size:12px; font-weight:700; text-decoration:none; }
    .pack-body { padding:26px 22px; border:1px solid var(--line); border-radius:18px; background:var(--panel); box-shadow:var(--shadow); }
    .pack-body h1 { max-width:none; margin:0 0 14px; font-size:clamp(25px,5vw,43px); letter-spacing:-.045em; }
    .pack-body h2 { margin:30px 0 10px; font-size:22px; }
    .pack-body h3 { margin:22px 0 8px; font-size:16px; color:#dbe6fb; }
    .pack-body p { color:#c0cce0; font-size:14px; }
    .pack-body ul { padding-left:22px; color:#c0cce0; font-size:13px; }
    .pack-body li { margin:6px 0; }
    .pack-body blockquote { margin:13px 0; padding:10px 14px; border-left:3px solid var(--blue); background:rgba(105,169,255,.07); color:var(--muted); font-size:13px; }
    .pack-body pre { overflow:auto; padding:14px; border-radius:10px; background:#080c17; color:#d7e4ff; font:12px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap; }
    .pack-body a { color:var(--blue); overflow-wrap:anywhere; }
    .pack-meta { color:var(--muted); font-size:11px; }
    .pack-error { padding:24px; border:1px dashed rgba(255,184,107,.5); border-radius:14px; color:var(--orange); }
    .copy-toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 18px; padding:12px; border:1px solid rgba(105,169,255,.3); border-radius:12px; color:var(--muted); font-size:12px; }
    .copy-section { margin:20px 0; padding:14px; border:1px solid rgba(255,255,255,.08); border-radius:14px; background:rgba(255,255,255,.02); }
    .copy-section-head { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .copy-section-head h1,.copy-section-head h2,.copy-section-head h3 { margin-top:0; }
    .copy-button { min-height:44px; padding:8px 12px; border:1px solid rgba(105,169,255,.5); border-radius:9px; background:#172848; color:#dbe6fb; font:700 11px/1.2 inherit; cursor:pointer; white-space:nowrap; }
    .copy-button.copy-ok { border-color:rgba(110,231,183,.7); background:#12382d; color:var(--green); }
    @media (max-width:520px) { .copy-toolbar,.copy-section-head { display:block; } .copy-toolbar .copy-button,.copy-section-head .copy-button { width:100%; margin-top:10px; } }
    @media (max-width:680px) { .pack-body { padding:20px 16px; } }
  </style>
</head>

    <footer class="footer"><span>AI VALUE RADAR v0.1</span><span>自動投稿・自動公開なし</span></footer>
  </div>
  <script src="assets/pack.js?v=20260831-4" defer></script>
